<!doctype html>
<html lang="en">
  <head>
    <!-- Basic Metadata -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Group 11" />
    <meta
      name="keywords"
      content="hospital, healthcare, medical services, doctors, appointment"
    />

    <!-- SEO -->
    <title>MEDDICAL | Contact</title>
    <meta
      name="description"
      content="MEDDICAL is a healthcare website providing professional medical services, experienced doctors, online appointment booking, and trusted patient care."
    />

    <!-- Open Graph -->
    <meta property="og:title" content="MEDDICAL | Contact" />
    <meta
      property="og:description"
      content="MEDDICAL is a healthcare website providing professional medical services, experienced doctors, online appointment booking, and trusted patient care."
    />
    <meta property="og:type" content="website" />
    <meta
      property="og:url"
      content="https://meddical-nhom11.vercel.app/Contact.html"
    />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;700&family=Yeseva+One&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- HEADER -->
    <header id="header" class="sticky top-0 z-50 bg-white"></header>

    <!-- SUBHEADER -->
    <section id="subheader"></section>

    <!-- PAGE CONTENT -->
    <main id="page-content" class="bg-white hidden">
      <!-- MAP VIEW -->
      <section id="mapview" class="mt-[48px] lg:mt-[64px]"></section>

      <!-- MAIN SECTION -->
      <section
        class="max-w-[992px] md:max-w-[600px] lg:max-w-[992px] mx-auto bg-white px-[24px] md:px-[64px] lg:px-0 mt-[48px] lg:mt-[64px] mb-[64px]"
      >
        <div class="grid grid-cols-1 gap-[32px] lg:grid-cols-2 lg:gap-[20px]">
          <!-- ========== LEFT COLUMN ========== -->
          <div class="flex flex-col h-auto lg:h-[486px]">
            <!-- 1. HEADING -->
            <header
              class="text-center lg:text-left mb-[24px] md:mb-[28px] lg:mb-[32px]"
            >
              <p class="caption text-secondary uppercase tracking-[4px]">
                Get in Touch
              </p>
              <h2 class="display-2 text-primary mt-[8px]">Contact</h2>
            </header>

            <!-- 2. FORM -->
            <form
              id="contactForm"
              class="flex flex-1 flex-col overflow-hidden rounded-[5px]"
            >
              <!-- Row 1: Name, Email -->
              <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-2">
                <!-- Name -->
                <label for="contactName" class="sr-only">Name</label>
                <input
                  id="contactName"
                  name="name"
                  type="text"
                  placeholder="Name"
                  autocomplete="name"
                  required
                  class="text-[13px] md:text-[15px] lg:body h-[50px] border border-accent bg-primary px-5 text-white placeholder-white outline-none rounded-tl-[5px]"
                />
                <!-- Email -->
                <label for="contactEmail" class="sr-only">Email</label>
                <input
                  id="contactEmail"
                  name="email"
                  type="email"
                  placeholder="Email"
                  autocomplete="email"
                  required
                  class="text-[13px] md:text-[15px] lg:body h-[50px] border border-accent md:border-l-0 lg:border-l-0 bg-primary px-5 text-white placeholder-white outline-none md:rounded-tr-[5px] lg:rounded-tr-[5px]"
                />
              </div>

              <!-- Row 2: Subject -->
              <label for="contactSubject" class="sr-only">Subject</label>
              <input
                id="contactSubject"
                name="subject"
                type="text"
                placeholder="Subject"
                placeholder="Subject"
                required
                class="text-[13px] md:text-[15px] lg:body h-[50px] w-full border-x border-b border-accent bg-primary px-5 text-white placeholder-white outline-none"
              />

              <!-- Row 3: Message -->
              <label for="contactMessage" class="sr-only">Message</label>
              <textarea
                id="contactMessage"
                name="message"
                placeholder="Message"
                autocomplete="off"
                aria-describedby="contactMessage-hint"
                class="text-[13px] md:text-[15px] lg:body flex-1 h-[235px] resize-none border-x border-b border-accent bg-primary p-5 text-white placeholder-white outline-none"
              ></textarea>
              <span id="contactMessage-hint" class="sr-only"
                >Enter your message.</span
              >

              <!-- Button -->
              <button
                type="submit"
                class="button-text flex h-[50px] w-full items-center justify-center bg-accent text-primary hover:bg-gray-400 uppercase rounded-bl-[5px] rounded-br-[5px]"
              >
                Submit
              </button>
            </form>
          </div>

          <!-- ========== RIGHT COLUMN ========== -->
          <section
            class="grid grid-cols-2 gap-x-[12px] gap-y-[12px] md:gap-x-[16px] md:gap-y-[16px] lg:gap-x-[20px] lg:gap-y-[20px]"
          >
            <!-- CARD 1: EMERGENCY -->
            <article
              class="group bg-accent text-primary p-4 md:p-4 lg:p-[52px_59px_50px_28px] aspect-square rounded-[4px] flex flex-col justify-center box-border transition-all duration-300 hover:bg-primary hover:text-white overflow-hidden"
            >
              <svg
                aria-hidden="true"
                width="41"
                height="39"
                viewBox="0 0 41 39"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
                class="mb-[15px] w-5 h-5 md:w-8 md:h-8 lg:w-[41px] lg:h-[39px] shrink-0"
              >
                <path
                  d="M24.1459 33.1262C24.7274 32.7905 25.1502 32.2347 25.3211 31.5811C25.492 30.9275 25.3972 30.2296 25.0574 29.6411L23.7761 27.4219C23.4363 26.8333 22.8794 26.4022 22.2279 26.2235C21.5764 26.0447 20.8837 26.1329 20.3021 26.4687C15.9167 29.0006 13.3542 24.5622 12.0729 22.343C10.7917 20.1238 8.22919 15.6854 12.6146 13.1535C13.1962 12.8178 13.6189 12.2619 13.7899 11.6084C13.9608 10.9548 13.8659 10.2569 13.5261 9.66835L12.2449 7.44916C11.905 6.8606 11.3481 6.42952 10.6966 6.25075C10.0451 6.07199 9.35243 6.16019 8.77089 6.49594C3.28908 9.66086 1.28125 13.779 7.6875 24.875C14.0938 35.9709 18.6641 36.2911 24.1459 33.1262Z"
                  class="stroke-primary group-hover:stroke-accent transition-colors duration-300"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
                <path
                  d="M35.8156 23.9621C36.9804 19.4989 36.3314 14.7346 34.0113 10.716C31.6911 6.69743 27.8896 3.75324 23.442 2.53032M29.1022 22.12C29.4492 20.7945 29.5325 19.4104 29.3472 18.0469C29.162 16.6835 28.712 15.3672 28.0227 14.1735C27.3335 12.9798 26.4187 11.9319 25.3305 11.0897C24.2423 10.2476 23.002 9.62766 21.6806 9.26539M22.4248 20.2645C22.6577 19.3714 22.5278 18.4181 22.0635 17.6141C21.5993 16.81 20.8387 16.2208 19.9488 15.9759"
                  class="stroke-primary group-hover:stroke-accent transition-colors duration-300"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>

              <!-- Caption -->
              <h3
                class="contact-title md:!text-[18px] text-primary group-hover:text-accent transition-colors duration-300 w-full whitespace-NOWRAP"
              >
                Emergency
              </h3>

              <!-- Body -->
              <address
                class="not-italic flex flex-col mt-[6px] md:mt-[7px] lg:mt-[8px] gap-[3px] md:gap-[4px] lg:gap-[5px] text-[16px] text-primary group-hover:text-accent transition-colors duration-300"
              >
                <a
                  href="tel:237681812255"
                  class="section-text md:!text-[16px] font-normal text-primary group-hover:text-white hover:underline block leading-[1.4]"
                  >(237) 681-812-255</a
                >
                <a
                  href="tel:237666331894"
                  class="section-text md:!text-[16px] font-normal text-primary group-hover:text-white hover:underline block leading-[1.4]"
                  >(237) 666-331-894</a
                >
              </address>
            </article>

            <!-- CARD 2: LOCATION -->
            <article
              class="group bg-accent text-primary p-4 md:p-4 lg:p-[53px_50px_50px_30px] aspect-square rounded-[4px] flex flex-col justify-center items-start box-border transition-all duration-300 hover:bg-primary hover:text-white overflow-hidden"
            >
              <svg
                aria-hidden="true"
                width="30"
                height="36"
                viewBox="0 0 32 39"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
                class="mb-[16px] w-5 h-5 md:w-8 md:h-8 lg:w-[30px] lg:h-[36px] shrink-0"
              >
                <path
                  d="M1 15.4C1 29.8 16 37 16 37C16 37 31 29.8 31 15.4C31 7.45 24.2875 1 16 1C7.7125 1 1 7.45 1 15.4Z"
                  class="stroke-primary group-hover:stroke-accent transition-colors duration-300"
                  stroke-width="2"
                />
                <path
                  transform="translate(9.5, 9.5)"
                  d="M6.16 11.32C9.00979 11.32 11.32 9.00979 11.32 6.16C11.32 3.31021 9.00979 1 6.16 1C3.31021 1 1 3.31021 1 6.16C1 9.00979 3.31021 11.32 6.16 11.32Z"
                  class="stroke-primary group-hover:stroke-accent transition-colors duration-300"
                  stroke-width="2"
                />
              </svg>

              <!-- Caption -->
              <h3
                class="contact-title md:!text-[18px] text-primary group-hover:text-accent transition-colors duration-300 w-full whitespace-NOWRAP"
              >
                Location
              </h3>

              <!-- Body -->
              <address
                class="not-italic flex flex-col mt-[6px] md:mt-[7px] lg:mt-[8px] gap-[3px] md:gap-[4px] lg:gap-[5px] text-[16px] font-normal text-primary group-hover:text-accent transition-colors duration-300"
              >
                <span
                  class="section-text md:!text-[16px] font-normal text-primary group-hover:text-white hover:underline block leading-[1.4]"
                  >0123 Some place</span
                >
                <span
                  class="section-text md:!text-[16px] font-normal text-primary group-hover:text-white hover:underline block leading-[1.4]"
                  >9876 Some country</span
                >
              </address>
            </article>

            <!-- CARD 3: EMAIL -->
            <article
              class="group bg-accent text-primary p-4 md:p-4 lg:p-[57px_22px_56px_30px] aspect-square rounded-[4px] flex flex-col justify-center items-start box-border transition-all duration-300 hover:bg-primary hover:text-white overflow-hidden"
            >
              <svg
                aria-hidden="true"
                width="36"
                height="30"
                viewBox="0 0 38 32"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
                class="mb-[18px] w-5 h-5 md:w-8 md:h-8 lg:w-[36px] lg:h-[30px] shrink-0"
              >
                <path
                  d="M1 1H36.4V30.5H1V1Z"
                  class="stroke-primary group-hover:stroke-accent transition-colors duration-300"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
                <path
                  d="M36.4 6.89996L18.7 18.7L1 6.89996"
                  class="stroke-primary group-hover:stroke-accent transition-colors duration-300"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>

              <!-- Caption -->
              <h3
                class="contact-title md:!text-[18px] text-primary group-hover:text-accent transition-colors duration-300 w-full whitespace-nowrap"
              >
                Email
              </h3>

              <!-- Body -->
              <address
                class="not-italic flex flex-col mt-[6px] md:mt-[7px] lg:mt-[8px] gap-[3px] md:gap-[4px] lg:gap-[5px] font-normal text-primary group-hover:text-accent transition-colors duration-300 w-full"
              >
                <a
                  href="mailto:fildineeesoe@gmail.com"
                  class="section-text md:!text-[16px] text-primary group-hover:text-white hover:underline block leading-[1.4]"
                  >fildineeesoe@gmil.com</a
                >
                <a
                  href="mailto:myebstudios@gmail.com"
                  class="section-text md:!text-[16px] lg:!text-[14px] text-primary group-hover:text-white hover:underline block leading-[1.4]"
                  >myebstudios@gmail.com</a
                >
              </address>
            </article>

            <!-- CARD 4: WORKING HOURS -->
            <article
              class="group bg-accent text-primary p-4 md:p-4 lg:p-[56px_18px_50px_30px] aspect-square rounded-[4px] flex flex-col justify-center items-start box-border transition-all duration-300 hover:bg-primary hover:text-white overflow-hidden"
            >
              <svg
                aria-hidden="true"
                width="30"
                height="30"
                viewBox="0 0 32 32"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
                class="mb-[19px] w-5 h-5 md:w-8 md:h-8 lg:w-[30px] lg:h-[30px] shrink-0"
              >
                <path
                  d="M16 31C24.2843 31 31 24.2843 31 16C31 7.71573 24.2843 1 16 1C7.71573 1 1 7.71573 1 16C1 24.2843 7.71573 31 16 31Z"
                  class="stroke-primary group-hover:stroke-accent transition-colors duration-300"
                  stroke-width="2"
                  stroke-linecap="round"
                />
                <path
                  d="M21 23.5L16 16V6"
                  class="stroke-primary group-hover:stroke-accent transition-colors duration-300"
                  stroke-width="2"
                  stroke-linecap="round"
                />
              </svg>

              <!-- Caption -->
              <h3
                class="contact-title md:!text-[18px] text-primary group-hover:text-accent transition-colors duration-300 w-full whitespace-nowrap"
              >
                Working Hours
              </h3>

              <!-- Body -->
              <address
                class="not-italic flex flex-col mt-[6px] md:mt-[7px] lg:mt-[8px] gap-[3px] md:gap-[4px] lg:gap-[5px] font-normal text-primary group-hover:text-accent transition-colors duration-300"
              >
                <span
                  class="section-text md:!text-[16px] font-normal text-primary group-hover:text-white hover:underline block leading-[1.4]"
                  >Mon-Sat 09:00-20:00</span
                >
                <span
                  class="section-text md:!text-[16px] font-normal text-primary group-hover:text-white hover:underline block leading-[1.4] whitespace-nowrap"
                  >Sunday Emergency only</span
                >
              </address>
            </article>
          </section>
        </div>
      </section>

      <!-- NEWS SECTION -->
      <section id="newssection"></section>

      <!-- FAQ -->
      <section id="faq"></section>
    </main>

    <!-- FOOTER -->
    <footer id="footer"></footer>

    <!-- JAVASCRIPT FILE -->
    <script type="module" src="/src/pages/Contact.js"></script>
  </body>
</html>
