<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="author" content="Group 11" />
    <meta
      name="keywords"
      content="medical services, healthcare services, appointment, MEDDICAL"
    />

    <title>MEDDICAL | My Appointment</title>

    <meta
      name="description"
      content="View and manage your MEDDICAL appointments."
    />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;700&family=Yeseva+One&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <!-- HEADER -->
    <header id="header" class="sticky top-0 z-50 bg-white"></header>

    <!-- PAGE CONTENT -->
    <main id="page-content" class="section bg-white">
      <!-- BACK BUTTON -->
      <button
        id="back-btn"
        type="button"
        class="btn-text w-full px-[10px] sm:max-w-[592px] md:max-w-[720px] lg:max-w-[992px] mx-auto pb-[19px]"
      >
        <svg
          aria-hidden="true"
          xmlns="http://www.w3.org/2000/svg"
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M19 12H5" />
          <path d="M12 19l-7-7 7-7" />
        </svg>
        <span class="leading-[22px]">Back</span>
      </button>

      <!-- APPOINTMENTS LIST -->
      <section
        class="mx-auto w-full max-w-[320px] md:max-w-[720px] lg:max-w-[992px] px-6 md:px-[64px] lg:px-0"
      >
        <!-- TITLE -->
        <div class="text-center mb-[40px] md:mb-[56px] lg:mb-[64px]">
          <p class="caption text-secondary mb-[8px]">MEDDICAL</p>
          <h1 class="display-2 mb-[8px] text-primary">My Appointment</h1>
          <p class="body mx-auto text-black">
            View and manage your upcoming appointments.
          </p>
        </div>

        <!-- APPOINTMENT LIST (render cards from js)-->
        <div
          id="appointment-list"
          class="flex w-full flex-col gap-[40px] md:gap-[60px]"
        ></div>
      </section>
    </main>

    <!-- FOOTER -->
    <footer id="footer"></footer>

    <!-- JAVASCRIPT -->
    <script type="module" src="/src/pages/MyAppointment.js"></script>
  </body>
</html>
