<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;700&family=Yeseva+One&display=swap"
      rel="stylesheet"
    />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MEDDICAL | News |</title>
  </head>
  <body>
    <header id="header" class="sticky top-0 z-50 bg-white"></header>
    <section id="newsSubheader"></section>

    <main
      id="page-content"
      class="w-full bg-white max-w-[995px] pb-[64px] mx-auto hidden"
    >
      <div id="back-btn" class="btn-text py-[32px]">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M19 12H5" />
          <path d="M12 19l-7-7 7-7" />
        </svg>
        <span>Back</span>
      </div>
      <div class="container gap-[20px] flex">
        <!-- Danh sách bài viết -->
        <section class="w-[658px]">
          <!-- Bài viết -->
          <div id="news-detail">
            <img id="detail-image" />
            <h1 id="detail-title"></h1>
            <p id="detail-description"></p>
          </div>
          <!-- nút pre, next -->
          <div class="mt-[64px] justify-between flex">
            <button id="prev-btn" class="btn-filled">
              <svg
                width="13"
                height="12"
                viewBox="0 0 13 12"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
              >
                <path
                  d="M5.61555 1L1.00016 6L5.61555 11M1.00016 6H11.8335"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
              Previous Article
            </button>
            <button id="next-btn" class="ml-[20px] btn-filled">
              Next Article
              <svg
                width="13"
                height="12"
                viewBox="0 0 13 12"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
              >
                <path
                  d="M7.21795 1L11.8333 6L7.21795 11M11.8333 6H1"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </button>
          </div>
        </section>
        <aside id="sidebar"></aside>
      </div>
      <section id="contact-section"></section>
    </main>
    <footer id="footer"></footer>
    <script type="module" src="/src/pages/NewsDetail.js"></script>
  </body>
</html>
