<!doctype html>
<html lang="en">
  <head>
    <!-- Basic Metadata -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Group 11" />
    <meta
      name="keywords"
      content="medical services, healthcare services, health checkup, cardiogram, DNA testing, blood bank, dermatology, orthopedic care, MEDDICAL"
    />

    <!-- SEO -->
    <title>MEDDICAL | Services</title>
    <meta
      name="description"
      content="Explore MEDDICAL's professional medical services, including health checkups, cardiograms, DNA testing, blood bank, dermatology, and orthopedic care."
    />

    <!-- Open Graph -->
    <meta property="og:title" content="MEDDICAL | Services" />
    <meta
      property="og:description"
      content="Explore MEDDICAL's professional medical services, including health checkups, cardiograms, DNA testing, blood bank, dermatology, and orthopedic care."
    />
    <meta property="og:type" content="website" />
    <!-- Bổ sung sau khi deploy -->
    <!-- <meta property="og:image" content="https://your-domain.com/preview.jpg" /> -->
    <!-- <meta property="og:url" content="https://your-domain.com" /> -->

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;700&family=Yeseva+One&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- HEADER -->
    <header id="header" class="sticky top-0 z-50 bg-white"></header>

    <!-- SUBHEADER -->
    <section id="subheader"></section>

    <!-- PAGE CONTENT -->
    <main id="page-content" class="bg-white mt-[48px] lg:mt-[19px] hidden">
      <!-- BACK BUTTON -->
      <div
        id="back-btn"
        class="btn-text w-full px-[10px] sm:max-w-[592px] md:max-w-[720px] lg:max-w-[992px] mx-auto pb-[19px]"
      >
        <svg
          aria-hidden="true"
          xmlns="http://www.w3.org/2000/svg"
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M19 12H5" />
          <path d="M12 19l-7-7 7-7" />
        </svg>
        <span class="leading-[22px]">Back</span>
      </div>
      <!-- SERVICES SECTION -->
      <section
        id="mainContent"
        class="max-w-[320px] md:max-w-[720px] lg:max-w-[992px] mx-auto mb-[64px] md:mb-[96px] lg:mb-[128px] px-[10px] md:px-0"
      >
        <div id="loading" class="hidden w-full text-center py-10">
          Loading ...
        </div>
      </section>

      <!-- DOCTORS SECTION -->
      <section
        id="doctorsSection"
        class="mb-[64px] md:mb-[96px] lg:mb-[128px]"
      ></section>

      <!-- CONTACTS SECTION -->
      <section
        id="contactsSection"
        class="mb-[32px] md:mb-[48px] lg:mb-[64px]"
      ></section>

      <!-- FAQ -->
      <section id="faq"></section>
    </main>

    <!-- FOOTER -->
    <footer id="footer"></footer>

    <!-- JAVASCRIPT FILE -->
    <script type="module" src="/src/pages/ServiceDetail.js"></script>
  </body>
</html>
