<section class="w-[491px] overflow-hidden rounded-[5px]">
  <form class="grid grid-cols-2">
    <input
      type="text"
      placeholder="Name"
      class="body h-[50px] border border-accent bg-primary px-5 text-white placeholder-white outline-none"
    />

    <label
      class="relative flex h-[50px] items-center border border-accent bg-primary px-5"
    >
      <select
        class="body w-full appearance-none bg-transparent pr-8 text-white outline-none"
        name="gender"
        required
      >
        <option value="" class="text-black bg-white" selected disabled>
          Gender
        </option>
        <option value="male" class="text-black bg-white">Male</option>
        <option value="female" class="text-black bg-white">Female</option>
        <option value="other" class="text-black bg-white">Other</option>
      </select>
      <svg
        class="pointer-events-none absolute right-5 shrink-0"
        width="16"
        height="10"
        viewBox="0 0 16 10"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
      >
        <path
          d="M13.9465 0.34977C14.1728 0.125697 14.4784 0 14.7969 0C15.1153 0 15.4209 0.125697 15.6472 0.34977C15.759 0.459802 15.8477 0.590958 15.9082 0.735605C15.9688 0.880251 16 1.0355 16 1.19231C16 1.34913 15.9688 1.50437 15.9082 1.64902C15.8477 1.79367 15.759 1.92482 15.6472 2.03485L8.85124 8.6952C8.62442 8.91896 8.31862 9.04442 8 9.04442C7.68138 9.04442 7.37558 8.91896 7.14876 8.6952L0.352777 2.03485C0.241047 1.92482 0.152318 1.79367 0.0917536 1.64902C0.0311894 1.50437 0 1.34913 0 1.19231C0 1.0355 0.0311894 0.880251 0.0917536 0.735605C0.152318 0.590958 0.241047 0.459802 0.352777 0.34977C0.57908 0.125697 0.884678 0 1.20315 0C1.52161 0 1.82721 0.125697 2.05351 0.34977L8.00261 5.81195L13.9465 0.34977Z"
          fill="#BFD2F8"
        />
      </svg>
    </label>

    <input
      type="email"
      placeholder="Email"
      class="body h-[50px] border border-accent bg-primary px-5 text-white placeholder-white outline-none"
    />

    <input
      type="tel"
      placeholder="Phone"
      class="body h-[50px] border border-accent bg-primary px-5 text-white placeholder-white outline-none"
    />

    <label
      class="relative flex h-[50px] items-center border border-accent bg-primary px-5 cursor-pointer"
    >
      <input
        type="text"
        placeholder="Date"
        name="date"
        required
        onfocus="this.type = 'date'"
        onblur="if (!this.value) this.type = 'text';"
        class="body w-full bg-transparent pr-8 text-white placeholder-white outline-none [color-scheme:dark] [&::-webkit-calendar-picker-indicator]:absolute [&::-webkit-calendar-picker-indicator]:left-0 [&::-webkit-calendar-picker-indicator]:top-0 [&::-webkit-calendar-picker-indicator]:h-full [&::-webkit-calendar-picker-indicator]:w-full [&::-webkit-calendar-picker-indicator]:cursor-pointer [&::-webkit-calendar-picker-indicator]:opacity-0"
      />
      <svg
        class="pointer-events-none absolute right-5 shrink-0"
        width="16"
        height="10"
        viewBox="0 0 16 10"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
      >
        <path
          d="M13.9465 0.34977C14.1728 0.125697 14.4784 0 14.7969 0C15.1153 0 15.4209 0.125697 15.6472 0.34977C15.759 0.459802 15.8477 0.590958 15.9082 0.735605C15.9688 0.880251 16 1.0355 16 1.19231C16 1.34913 15.9688 1.50437 15.9082 1.64902C15.8477 1.79367 15.759 1.92482 15.6472 2.03485L8.85124 8.6952C8.62442 8.91896 8.31862 9.04442 8 9.04442C7.68138 9.04442 7.37558 8.91896 7.14876 8.6952L0.352777 2.03485C0.241047 1.92482 0.152318 1.79367 0.0917536 1.64902C0.0311894 1.50437 0 1.34913 0 1.19231C0 1.0355 0.0311894 0.880251 0.0917536 0.735605C0.152318 0.590958 0.241047 0.459802 0.352777 0.34977C0.57908 0.125697 0.884678 0 1.20315 0C1.52161 0 1.82721 0.125697 2.05351 0.34977L8.00261 5.81195L13.9465 0.34977Z"
          fill="#BFD2F8"
        />
      </svg>
    </label>

    <label
      class="relative flex h-[50px] items-center border border-accent bg-primary px-5"
    >
      <input
        type="text"
        placeholder="Time"
        name="time"
        required
        onfocus="this.type = 'time'"
        onblur="if (!this.value) this.type = 'text';"
        class="body w-full bg-transparent pr-8 text-white placeholder-white outline-none [color-scheme:dark] [&::-webkit-calendar-picker-indicator]:absolute [&::-webkit-calendar-picker-indicator]:left-0 [&::-webkit-calendar-picker-indicator]:top-0 [&::-webkit-calendar-picker-indicator]:h-full [&::-webkit-calendar-picker-indicator]:w-full [&::-webkit-calendar-picker-indicator]:cursor-pointer [&::-webkit-calendar-picker-indicator]:opacity-0"
      />
      <svg
        class="pointer-events-none absolute right-5 shrink-0"
        width="16"
        height="10"
        viewBox="0 0 16 10"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
      >
        <path
          d="M13.9465 0.34977C14.1728 0.125697 14.4784 0 14.7969 0C15.1153 0 15.4209 0.125697 15.6472 0.34977C15.759 0.459802 15.8477 0.590958 15.9082 0.735605C15.9688 0.880251 16 1.0355 16 1.19231C16 1.34913 15.9688 1.50437 15.9082 1.64902C15.8477 1.79367 15.759 1.92482 15.6472 2.03485L8.85124 8.6952C8.62442 8.91896 8.31862 9.04442 8 9.04442C7.68138 9.04442 7.37558 8.91896 7.14876 8.6952L0.352777 2.03485C0.241047 1.92482 0.152318 1.79367 0.0917536 1.64902C0.0311894 1.50437 0 1.34913 0 1.19231C0 1.0355 0.0311894 0.880251 0.0917536 0.735605C0.152318 0.590958 0.241047 0.459802 0.352777 0.34977C0.57908 0.125697 0.884678 0 1.20315 0C1.52161 0 1.82721 0.125697 2.05351 0.34977L8.00261 5.81195L13.9465 0.34977Z"
          fill="#BFD2F8"
        />
      </svg>
    </label>

    <label
      class="relative flex h-[50px] items-center border border-accent bg-primary px-5 cursor-pointer"
    >
      <input
        type="text"
        id="doctor-input"
        placeholder="Doctor"
        name="doctor"
        required
        oninput="document.getElementById('doctor-select').value = this.value"
        class="body absolute left-5 top-0 w-[calc(100%-60px)] h-full bg-transparent text-white placeholder-white outline-none z-10"
      />
      <select
        id="doctor-select"
        onchange="document.getElementById('doctor-input').value = this.value"
        class="body w-full appearance-none bg-transparent pr-8 text-black outline-none cursor-pointer"
      >
        <option value="" class="text-black bg-white" selected disabled></option>
      </select>
      <svg
        class="pointer-events-none absolute right-5 shrink-0"
        width="16"
        height="10"
        viewBox="0 0 16 10"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
      >
        <path
          d="M13.9465 0.34977C14.1728 0.125697 14.4784 0 14.7969 0C15.1153 0 15.4209 0.125697 15.6472 0.34977C15.759 0.459802 15.8477 0.590958 15.9082 0.735605C15.9688 0.880251 16 1.0355 16 1.19231C16 1.34913 15.9688 1.50437 15.9082 1.64902C15.8477 1.79367 15.759 1.92482 15.6472 2.03485L8.85124 8.6952C8.62442 8.91896 8.31862 9.04442 8 9.04442C7.68138 9.04442 7.37558 8.91896 7.14876 8.6952L0.352777 2.03485C0.241047 1.92482 0.152318 1.79367 0.0917536 1.64902C0.0311894 1.50437 0 1.34913 0 1.19231C0 1.0355 0.0311894 0.880251 0.0917536 0.735605C0.152318 0.590958 0.241047 0.459802 0.352777 0.34977C0.57908 0.125697 0.884678 0 1.20315 0C1.52161 0 1.82721 0.125697 2.05351 0.34977L8.00261 5.81195L13.9465 0.34977Z"
          fill="#BFD2F8"
        />
      </svg>
    </label>

    <label
      class="relative flex h-[50px] items-center border border-accent bg-primary px-5 cursor-pointer"
    >
      <input
        type="text"
        placeholder="Department"
        name="department"
        required
        oninput="this.nextElementSibling.value = this.value"
        class="body absolute left-5 top-0 w-[calc(100%-60px)] h-full bg-transparent text-white placeholder-white outline-none z-10"
      />
      <select
        onchange="this.previousElementSibling.value = this.value"
        class="body w-full appearance-none bg-transparent pr-8 text-transparent outline-none cursor-pointer"
      >
        <option value="" class="text-black bg-white" selected disabled></option>
        <option value="Cardiology" class="text-black bg-white">
          Cardiology
        </option>
        <option value="Pediatrics" class="text-black bg-white">
          Pediatrics
        </option>
        <option value="Dermatology" class="text-black bg-white">
          Dermatology
        </option>
      </select>
      <svg
        class="pointer-events-none absolute right-5 shrink-0"
        width="16"
        height="10"
        viewBox="0 0 16 10"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
      >
        <path
          d="M13.9465 0.34977C14.1728 0.125697 14.4784 0 14.7969 0C15.1153 0 15.4209 0.125697 15.6472 0.34977C15.759 0.459802 15.8477 0.590958 15.9082 0.735605C15.9688 0.880251 16 1.0355 16 1.19231C16 1.34913 15.9688 1.50437 15.9082 1.64902C15.8477 1.79367 15.759 1.92482 15.6472 2.03485L8.85124 8.6952C8.62442 8.91896 8.31862 9.04442 8 9.04442C7.68138 9.04442 7.37558 8.91896 7.14876 8.6952L0.352777 2.03485C0.241047 1.92482 0.152318 1.79367 0.0917536 1.64902C0.0311894 1.50437 0 1.34913 0 1.19231C0 1.0355 0.0311894 0.880251 0.0917536 0.735605C0.152318 0.590958 0.241047 0.459802 0.352777 0.34977C0.57908 0.125697 0.884678 0 1.20315 0C1.52161 0 1.82721 0.125697 2.05351 0.34977L8.00261 5.81195L13.9465 0.34977Z"
          fill="#BFD2F8"
        />
      </svg>
    </label>

    <textarea
      placeholder="Message"
      class="body col-span-2 h-[189px] resize-none border border-accent bg-primary pt-4 pb-4 pl-5 pr-4 text-white placeholder-white outline-none"
    ></textarea>

    <button
      type="submit"
      class="footer-2 col-span-2 flex h-[50px] items-center justify-center bg-accent text-primary"
    >
      Submit
    </button>
  </form>
</section>
