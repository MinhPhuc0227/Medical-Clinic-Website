<div id="subheader"></div>
<main class="w-full bg-white max-w-[995px] py-[64px] mx-auto">
  <div class="container gap-[20px] flex">
    <!-- Danh sách bài viết -->
    <section class="w-[658px]">
      <div id="news-list" class="flex flex-col gap-10"></div>

      <!-- Pagination -->

      <div class="flex justify-between gap-3 mt-[32px]">
        <button id="prev" class="btn-text body hover:opacity-30% transition">
          <svg
            width="13"
            height="12"
            viewBox="0 0 13 12"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              d="M5.6153 1L0.999919 6L5.6153 11M0.999919 6H11.8333"
              stroke="#1F2B6C"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
          Previous
        </button>

        <div id="pagination" class="body"></div>

        <button id="next" class="btn-text body hover:opacity-30% transition">
          Next
          <svg
            width="13"
            height="12"
            viewBox="0 0 13 12"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              d="M7.21795 1L11.8333 6L7.21795 11M11.8333 6H1"
              stroke="#1F2B6C"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </button>
      </div>
    </section>

    <!-- Sidebar -->
    <aside id="sidebar"></aside>
  </div>
</main>
<section id="contact-section"></section>
