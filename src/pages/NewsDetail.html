<div id="newsSubheader"></div>
<main class="w-full bg-white max-w-[995px] py-[64px] mx-auto">
  <div class="container gap-[20px] flex">
    <!-- Danh sách bài viết -->
    <section class="w-[658px]">
      <!-- Bài viết -->
      <div id="news-detail">
        <img id="detail-image" />
        <h1 id="detail-title"></h1>
        <p id="detail-description"></p>
      </div>
      <!-- nút pre, next -->
      <div class="mt-[64px] justify-between flex">
        <button id="prev-btn" class="btn-filled">
          <svg
            width="13"
            height="12"
            viewBox="0 0 13 12"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              d="M5.61555 1L1.00016 6L5.61555 11M1.00016 6H11.8335"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
          Previous Article
        </button>
        <button id="next-btn" class="ml-[20px] btn-filled">
          Next Article
          <svg
            width="13"
            height="12"
            viewBox="0 0 13 12"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              d="M7.21795 1L11.8333 6L7.21795 11M11.8333 6H1"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </button>
      </div>
    </section>
    <aside id="sidebar"></aside>
  </div>
  <div id="contact-section"></div>
</main>
